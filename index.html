<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Management Dashboard</title>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --gold: #d4af37;
            --white: #ffffff;
            --gray: #2a2a2a;
            --low: #f4cccc;
            --low-dark: #7a3030;
        }

        body {
            font-family: sans-serif;
            background: var(--bg);
            color: var(--white);
            margin: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        header {
            height: 60px;
            background: var(--card);
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            padding: 0 15px;
            flex-shrink: 0;
            z-index: 10;
            position: relative;
        }

        .header-logo {
            position: absolute;
            left: -40px;
            top: 50%;
            transform: translateY(-50%);
            width: 300px;
            height: 120px;
            object-fit: contain;
            z-index: 5;
            pointer-events: none;
        }

        .header-title {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            font-weight: bold;
            font-size: 0.75rem;
            text-transform: uppercase;
            z-index: 10;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
            max-width: 40%;
            text-align: right;
        }

        .swiper {
            width: 100%;
            height: 100%;
        }

        .swiper-slide {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .container {
            width: 94%;
            max-width: 500px;
            margin: 10px auto;
            padding-bottom: 120px;
        }

        .metric-selector {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding-bottom: 12px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
        }

        .metric-selector::-webkit-scrollbar,
        .year-selector::-webkit-scrollbar {
            display: none;
        }

        .metric-btn {
            white-space: nowrap;
            padding: 10px 18px;
            border-radius: 10px;
            background: var(--gray);
            border: 1px solid #444;
            color: #aaa;
            font-size: 0.8rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .metric-btn.active {
            background: var(--gold);
            color: #000;
            font-weight: bold;
        }

        .year-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding: 5px 0;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
        }

        .year-btn {
            padding: 6px 15px;
            border-radius: 20px;
            background: var(--gray);
            border: 1px solid #444;
            color: #aaa;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .year-btn.active {
            background: #444;
            color: var(--gold);
            border-color: var(--gold);
        }

        .select-box {
            background: var(--card);
            border: 1px solid #444;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }

        .dropdown {
            display: none;
            background: var(--card);
            border: 1px solid #444;
            border-radius: 10px;
            padding: 5px;
            max-height: 400px;
            overflow-y: auto;
            position: absolute;
            width: 90%;
            max-width: 470px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .store-header {
            background: rgba(212, 175, 55, 0.1);
            padding: 10px;
            color: var(--gold);
            font-weight: bold;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .staff-option {
            padding: 12px 10px 12px 40px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
        }

        .chart-card {
            background: var(--card);
            border-radius: 15px;
            padding: 10px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            height: 320px;
            margin-top: 10px;
        }

        .stats-container {
            margin-top: 12px;
        }

        .stats-title {
            margin-bottom: 8px;
            color: #aaa;
            font-size: 0.75rem;
        }

        .stat-card {
            background: var(--card);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid var(--gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .stat-name {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            border-top: 1px solid #333;
            margin-top: 10px;
            padding-top: 10px;
        }

        .triple-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            border-top: 1px solid #333;
            margin-top: 10px;
            padding-top: 10px;
        }

        .data-item {
            min-width: 0;
        }

        .data-label {
            display: block;
            font-size: 0.6rem;
            color: #aaa;
            margin-bottom: 4px;
        }

        .data-value {
            display: block;
            font-size: 1.1rem;
            color: var(--gold);
            font-weight: bold;
            word-break: break-all;
        }

        .data-value.sub {
            color: #eee;
            font-size: 0.9rem;
        }

        #loading {
            text-align: center;
            padding-top: 100px;
            color: var(--gold);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: var(--bg);
        }

        input[type="checkbox"] {
            transform: scale(1.3);
            accent-color: var(--gold);
        }
    </style>
</head>

<script>
    const OS_API_URL =
        "https://os.senryoyakusha.com/api/integrations/dashboard/read";

    const LIFF_ID =
        "2009530502-irIiJIX4";

    const COLORS = [
        'rgba(212,175,55',
        'rgba(52,152,219',
        'rgba(231,76,60',
        'rgba(46,204,113',
        'rgba(155,89,182',
        'rgba(241,196,15',
        'rgba(26,188,156',
        'rgba(230,126,34'
    ];

    const MONTH_LABELS = [
        '1月',
        '2月',
        '3月',
        '4月',
        '5月',
        '6月',
        '7月',
        '8月',
        '9月',
        '10月',
        '11月',
        '12月'
    ];

    let allData = null;

    let c1 = null;
    let c2 = null;
    let c3 = null;
    let c4 = null;

    let swiperInstance = null;

    let sK = [];
    let sY = [];
    let sS = [];
    let sA = [];

    let m1 = 'sales';
    let m2 = 'totalRate';
    let m3 = 'storeSales';
    let m4 = 'totalSales';

    const formats = {
        sales: {
            u: '￥',
            s: '',
            d: 0
        },

        shimeiSales: {
            u: '￥',
            s: '',
            d: 0
        },

        timePrice: {
            u: '￥',
            s: '',
            d: 0
        },

        shimeiCount: {
            u: '',
            s: '名',
            d: 0
        },

        nextReserve: {
            u: '',
            s: '％',
            d: 2
        },

        newRepeat: {
            u: '',
            s: '％',
            d: 2
        },

        totalRate: {
            u: '',
            s: '％',
            d: 2
        },

        techRate: {
            u: '',
            s: '％',
            d: 2
        },

        orderableAmount: {
            u: '￥',
            s: '',
            d: 0
        },

        colorRate: {
            u: '',
            s: '％',
            d: 2
        },

        treatmentRate: {
            u: '',
            s: '％',
            d: 2
        },

        permRate: {
            u: '',
            s: '％',
            d: 2
        },

        storeSales: {
            u: '￥',
            s: '',
            d: 0
        },

        storeProfit: {
            u: '￥',
            s: '',
            d: 0
        },

        storeShimei: {
            u: '￥',
            s: '',
            d: 0
        },

        storeTech: {
            u: '￥',
            s: '',
            d: 0
        },

        storeTenba: {
            u: '￥',
            s: '',
            d: 0
        },

        storeAvgPrice: {
            u: '￥',
            s: '',
            d: 0
        },

        storeNewCount: {
            u: '',
            s: '名',
            d: 0
        },

        storeHourPrice: {
            u: '￥',
            s: '',
            d: 0
        },

        storeNextRate: {
            u: '',
            s: '％',
            d: 2
        },

        storeNewRepeat: {
            u: '',
            s: '％',
            d: 2
        },

        totalSales: {
            u: '￥',
            s: '',
            d: 0
        },

        companyProfit: {
            u: '￥',
            s: '',
            d: 0
        },

        fcf: {
            u: '￥',
            s: '',
            d: 0
        },

        balance: {
            u: '￥',
            s: '',
            d: 0
        },

        expense: {
            u: '￥',
            s: '',
            d: 0
        }
    };

    window.onload = function() {
        liff
            .init({
                liffId: LIFF_ID
            })
            .then(() => {
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const accessToken =
                    liff.getAccessToken();

                if (!accessToken) {
                    throw new Error(
                        'LIFF access token is unavailable.'
                    );
                }

                return init(accessToken);
            })
            .catch(error => {
                document
                    .getElementById(
                        'loading-text'
                    )
                    .innerText =
                        'LIFF Init Error: ' +
                        error;
            });
    };

    async function init(accessToken) {
        try {
            document
                .getElementById(
                    'loading-text'
                )
                .innerText =
                    'Fetching Data...';

            const response =
                await fetch(
                    OS_API_URL,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type':
                                'application/json'
                        },
                        body:
                            JSON.stringify({
                                accessToken
                            })
                    }
                );

            if (!response.ok) {
                throw new Error(
                    'OS API HTTP ' +
                    response.status
                );
            }

            allData =
                await response.json();

            if (
                allData.status !==
                'success'
            ) {
                throw new Error(
                    allData.message ||
                    'データ取得に失敗しました。'
                );
            }

            const level =
                allData.myInfo.level;

            const userName =
                allData.myInfo.userName;

            if (level < 4) {
                const slide =
                    document
                        .getElementById(
                            'slide-4'
                        );

                if (slide) {
                    slide.remove();
                }
            }

            if (level < 3) {
                const slide =
                    document
                        .getElementById(
                            'slide-3'
                        );

                if (slide) {
                    slide.remove();
                }
            }

            if (level < 2) {
                const slide =
                    document
                        .getElementById(
                            'slide-2'
                        );

                if (slide) {
                    slide.remove();
                }
            }

            swiperInstance =
                new Swiper(
                    '.swiper',
                    {
                        pagination: {
                            el:
                                '.swiper-pagination',

                            clickable:
                                true
                        },

                        observer:
                            true,

                        observeParents:
                            true,

                        threshold:
                            15,

                        resistanceRatio:
                            0,

                        touchStartPreventDefault:
                            false,

                        noSwiping:
                            true,

                        noSwipingClass:
                            'metric-selector'
                    }
                );

            sY = [
                allData.yearList[0]
            ];

            const myInfo =
                allData.staffList
                    .find(staff =>
                        staff.rawName
                            .replace(
                                /\s+/g,
                                ''
                            ) ===
                        userName
                    );

            const myStore =
                myInfo
                    ? myInfo.store
                    : allData.storeList[0];

            sK =
                allData.staffList
                    .filter(staff =>
                        staff.rawName
                            .replace(
                                /\s+/g,
                                ''
                            ) ===
                        userName
                    )
                    .map(staff =>
                        staff.name
                    );

            if (
                sK.length === 0 &&
                allData.staffList.length > 0
            ) {
                sK = [
                    allData
                        .staffList[0]
                        .name
                ];
            }

            sS = myStore
                ? [myStore]
                : [];

            sA = myStore
                ? [myStore]
                : [];

            renderYears();
            renderDrops();

            await updateM1();

            document
                .getElementById(
                    'loading'
                )
                .style
                .display =
                    'none';

            setTimeout(() => {
                if (level >= 2) {
                    updateM2();
                }

                if (level >= 3) {
                    updateM3();
                }

                if (level >= 4) {
                    updateM4();
                }
            }, 300);

        } catch (error) {
            document
                .getElementById(
                    'loading-text'
                )
                .innerText =
                    'Fetch Error: ' +
                    error;
        }
    }

    function getF(value, metric) {
        const format =
            formats[metric] || {
                u: '',
                s: '',
                d: 0
            };

        if (
            value === null ||
            value === undefined ||
            value === '' ||
            !Number.isFinite(Number(value))
        ) {
            return '—';
        }

        let displayValue =
            Number(value);

        if (
            format.s === '％'
        ) {
            displayValue *= 100;
        }

        return (
            format.u +
            displayValue
                .toLocaleString(
                    undefined,
                    {
                        minimumFractionDigits:
                            format.d,

                        maximumFractionDigits:
                            format.d
                    }
                ) +
            format.s
        );
    }

        const html =
            allData.yearList
                .map(year =>
                    `<button

                        onclick="toggleY('${year}')"
                    >
                        ${year}年
                    </button>`
                )
                .join('');

        [
            '1',
            '2',
            '3',
            '4'
        ].forEach(index => {
            const element =

                        'year-' + index
                    );

            if (element) {

            }
        });

    async function toggleY(year) {
        if (sY.includes(year)) {
            if (sY.length > 1) {
                sY =
                    sY.filter(
                        item =>
                            item !== year
                    );
            }

        } else {
            sY.push(year);
        }

        sY
            .sort()
            .reverse();

        renderYears();

        const level =
            allData.myInfo.level;

        const tasks = [];

        if (level >= 1) {
            tasks.push(
                updateM1()
            );
        }

        if (level >= 2) {
            tasks.push(
                updateM2()
            );
        }

        if (level >= 3) {
            tasks.push(
                updateM3()
            );
        }

        if (level >= 4) {
            tasks.push(
                updateM4()
            );
        }

        await Promise.all(tasks);
    }

                            }
                        }
                    }
                }
            );

        const monthIndex =
            new Date()
                .getMonth();

        if (
            m4 === 'expense'
        ) {
            document
                .getElementById(
                    'cards-4'
                )
                .innerHTML =
                    `<div class="stat-card">
                        <span class="stat-name">
                            経費残額
                        </span>

                        <div class="triple-grid">
                            <div class="data-item">
                                <span class="data-label">
                                    中園B
                                </span>

                                <span class="data-value sub">
                                    ${getF(
                                        data.nakazonoB[
                                            monthIndex
                                        ],
                                        'expense'
                                    )}
                                </span>
                            </div>

                            <div class="data-item">
                                <span class="data-label">
                                    椹木B
                                </span>

                                <span class="data-value sub">
                                    ${getF(
                                        data.sawaragiB[
                                            monthIndex
                                        ],
                                        'expense'
                                    )}
                                </span>
                            </div>

                            <div class="data-item">
                                <span class="data-label">
                                    江川B
                                </span>

                                <span class="data-value sub">
                                    ${getF(
                                        data.egawaB[
                                            monthIndex
                                        ],
                                        'expense'
                                    )}
                                </span>
                            </div>
                        </div>
                    </div>`;

        } else {
            const value =
                data[m4][monthIndex];

            document
                .getElementById(
                    'cards-4'
                )
                .innerHTML =
                    `<div class="stat-card">
                        <div class="stat-row">
                            <span class="stat-name">
                                実績
                            </span>

                            <span class="data-value">
                                ${getF(
                                    value,
                                    m4
                                )}
                            </span>
                        </div>
                    </div>`;
        }
    }
</script>
